<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>西區網球場控制台</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #eef2f3; }
        .card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 350px; }
        h2 { text-align: center; color: #1a73e8; margin-bottom: 20px; }
        label { display: block; margin-top: 15px; font-weight: bold; color: #555; }
        select, input { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: #1a73e8; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; margin-top: 25px; cursor: pointer; }
        button:hover { background: #1557b0; }
        .footer { font-size: 12px; color: #999; text-align: center; margin-top: 15px; }
    </style>
</head>
<body>

<div class="card">
    <h2>網球場快速預約</h2>
    
    <label>1. 選擇日期</label>
    <input type="date" id="dateInput">

    <label>2. 選擇球場</label>
    <select id="staffInput">
        <option value="78910">2 號球場</option>
        <option value="78911" selected>3 號球場</option>
        <option value="78912">4 號球場</option>
    </select>

    <label>3. 選擇時間</label>
    <select id="timeInput"></select>

    <button onclick="launch()">前往預約頁面</button>
    <div class="footer">搭配油猴腳本即可自動選取</div>
</div>

<script>
    const dIn = document.getElementById('dateInput');
    const tIn = document.getElementById('timeInput');
    const now = new Date();
    
    // 設定預設日期
    dIn.value = now.toISOString().split('T')[0];
    dIn.min = dIn.value;

    function buildTime() {
        tIn.innerHTML = '';
        for(let h=8; h<=21; h++) {
            const val = h.toString().padStart(2, '0') + "00";
            const opt = document.createElement('option');
            opt.value = val;
            opt.textContent = `${h}:00 ${h >= 17 ? '(夜間)' : ''}`;
            tIn.appendChild(opt);
        }
    }
    buildTime();

    function launch() {
        const date = dIn.value;
        const staff = document.getElementById('staffInput').value;
        const time = tIn.value;
        const h = parseInt(time.substring(0,2));

        // 判斷日夜網址
        const baseUrl = h >= 17 
            ? "https://tinybot.cc/dreams/product/%E8%A5%BF%E5%8D%80%E7%B6%B2%E7%90%83%E6%96%B9%E6%A1%886-%E5%A4%9C%E9%96%93%E7%87%88%E5%85%89%E8%B2%BB/"
            : "https://tinybot.cc/dreams/product/%E8%A5%BF%E5%8D%80%E7%B6%B2%E7%90%83%E6%96%B9%E6%A1%886/";

        window.location.href = `${baseUrl}?date=${date}&staff=${staff}&time=${time}`;
    }
</script>

</body>
</html>
